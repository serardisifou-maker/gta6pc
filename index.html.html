<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gta 6 for pc</title>
<style>
  :root{
    --bg:#1a0f2e; --bg2:#ff5e8a; --bg3:#ffb347; --ink:#fff7ef; --muted:#e8d6ff;
    --red:#ff0033; --card:rgba(20,8,40,.72);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    margin:0;height:100%;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#2b1055 0%,#7b2a86 38%,var(--bg2) 72%,var(--bg3) 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .gate{width:min(92vw,460px);background:var(--card);border:1px solid rgba(255,255,255,.18);
    border-radius:20px;padding:32px 26px;text-align:center;backdrop-filter:blur(6px)}
  h1{margin:0 0 6px;font-size:clamp(2.4rem,9vw,3.4rem);font-weight:800;letter-spacing:.02em;direction:ltr}
  h1 b{color:var(--bg3)}
  p{margin:10px 0 22px;color:var(--muted);line-height:1.8}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;font:inherit;font-weight:700;
    font-size:1.05rem;cursor:pointer;text-decoration:none;color:#fff;transition:transform .15s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .yt{background:var(--red)}
  .go{background:#fff;color:#2b1055;margin-top:12px}
  .go[disabled]{opacity:.35;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--bg3);outline-offset:3px}
  .hint{font-size:.85rem;margin:14px 0 0;color:var(--muted)}
  #black{position:fixed;inset:0;background:#000;display:none;z-index:99}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
  <main class="gate" id="gate">
    <h1>GTA <b>6</b> for PC</h1>
    <p>للدخول إلى الموقع، اشترك أولاً في القناة ثم ارجع إلى هنا.</p>
    <a class="btn yt" id="sub" href="https://www.youtube.com/@TFXYT_OFFICIAL" target="_blank" rel="noopener">اشترك في القناة على يوتيوب</a>
    <button class="btn go" id="enter" disabled>لقد اشتركت، ادخل الآن</button>
    <p class="hint" id="hint">اضغط زر الاشتراك أولاً لتفعيل الدخول.</p>
  </main>
  <div id="black" aria-label="شاشة سوداء"></div>

<script>
  var sub=document.getElementById('sub'),
      enter=document.getElementById('enter'),
      hint=document.getElementById('hint'),
      black=document.getElementById('black');

  // After the visitor opens the channel, unlock the enter button.
  sub.addEventListener('click',function(){
    setTimeout(function(){
      enter.disabled=false;
      hint.textContent='بعد الاشتراك اضغط زر الدخول.';
    },1500);
  });

  // Entering shows the black screen.
  enter.addEventListener('click',function(){
    if(enter.disabled)return;
    document.getElementById('gate').style.display='none';
    black.style.display='block';
    document.body.style.background='#000';
  });
</script>
</body>
</html>
